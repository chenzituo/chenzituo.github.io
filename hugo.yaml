baseURL: "https://chenzituo.github.io/"
locale: en-US
title: "Zituo’s Notes"
theme: PaperMod
timeZone: America/New_York
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
pagination:
  pagerSize: 10
outputs:
  home: [HTML, RSS, JSON]
params:
  description: "Learning notes, ideas, and explanations by Zituo."
  author: Zituo
  assets:
    favicon: favicon-fire.svg
    favicon16x16: favicon-16x16.png?v=fire1
    favicon32x32: favicon-32x32.png?v=fire1
    apple_touch_icon: apple-touch-icon.png?v=fire1
    safari_pinned_tab: safari-pinned-tab.svg?v=fire1
  defaultTheme: auto
  DateFormat: "January 2, 2006"
  mainSections: [posts]
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  showtoc: true
  tocopen: false
  math: false
  homeInfoParams:
    Title: "Welcome to Zituo’s Notes"
    Content: "A place for learning notes, ideas, and explanations worth returning to."
  socialIcons:
    - name: rss
      url: index.xml
    - name: github
      title: GitHub
      url: https://github.com/chenzituo
    - name: googlescholar
      title: Google Scholar
      url: https://scholar.google.com/citations?user=ML80AjoAAAAJ&hl=en
    - name: linkedin
      title: LinkedIn
      url: https://www.linkedin.com/in/zituo-chen/
    - name: instagram
      title: Instagram
      url: https://www.instagram.com/chen.zituo/
    - name: wechat
      title: WeChat · 与子同石
      url: /wechat/
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.35
    minMatchCharLength: 2
    keys: [title, permalink, summary, content]
menu:
  main:
    - identifier: posts
      name: Posts
      url: /
      weight: 10
    - identifier: archive
      name: Archive
      url: /archives/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
markup:
  highlight:
    noClasses: false
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\[', '\]']]
          inline: [['\(', '\)']]
caches:
  images:
    dir: :cacheDir/images
